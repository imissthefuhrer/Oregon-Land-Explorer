name: Marion County Parcel Sample

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/parcel-sample.yml'
      - 'scripts/build-preview.py'

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Download sample parcels and create preview
        run: python scripts/build-preview.py

      - name: Upload parcel sample and map preview
        uses: actions/upload-artifact@v4
        with:
          name: marion-parcel-sample
          path: output/
          retention-days: 30
