
name: Marion County Parcel Sample

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download sample parcel geometry
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          endpoint = (
              "https://services3.arcgis.com/"
              "SXXjryU22GsO8OEC/arcgis/rest/services/"
              "Parcels/FeatureServer/0/query"
          )

          params = {
              "where": "1=1",
              "outFields": "OBJECTID,TAXLOT,ACRES",
              "returnGeometry": "true",
              "outSR": "4326",
              "resultRecordCount": "10",
              "orderByFields": "OBJECTID ASC",
              "f": "geojson",
          }

          url = endpoint + "?" + urllib.parse.urlencode(params)
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "OregonLandExplorer/0.1"
              }
          )

          with urllib.request.urlopen(
              request, timeout=60
          ) as response:
              data = json.load(response)

          if "error" in data:
              raise RuntimeError(
                  json.dumps(data["error"])
              )

          if data.get("type") != "FeatureCollection":
              raise RuntimeError(
                  "Unexpected GeoJSON response"
              )

          features = data.get("features", [])
          if not features:
              raise RuntimeError("No parcels returned")

          for feature in features:
              if not feature.get("geometry"):
                  raise RuntimeError(
                      "Parcel missing geometry"
                  )

          Path("output").mkdir(exist_ok=True)

          Path("output/parcels.geojson").write_text(
              json.dumps(data),
              encoding="utf-8"
          )

          print(
              f"Successfully downloaded "
              f"{len(features)} parcel polygons."
          )
          PY

      - name: Create interactive map
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from html import escape

          data = json.loads(
              Path("output/parcels.geojson").read_text()
          )

          geojson = json.dumps(data).replace(
              "<", "\\u003c"
          )

          html = """<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1">
            <title>Oregon Land Explorer</title>
            <link rel="stylesheet"
              href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
            <style>
              body { margin: 0; font-family: sans-serif; }
              #map { height: 100vh; width: 100%; }
            </style>
          </head>
          <body>
            <div id="map"></div>
            <script
              src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
            </script>
            <script>
              const parcels = GEOJSON_PLACEHOLDER;
              const map = L.map("map");

              L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                  attribution: "&copy; OpenStreetMap contributors",
                  maxZoom: 19
                }
              ).addTo(map);

              const layer = L.geoJSON(parcels, {
                style: {
                  color: "#ff9800",
                  weight: 2,
                  fillOpacity: 0.2
                },
                onEachFeature: (feature, polygon) => {
                  const p = feature.properties || {};
                  const panel = document.createElement("div");
                  const heading = document.createElement("strong");
                  heading.textContent = "Tax lot: " +
                    (p.TAXLOT ?? "Unknown");
                  const acres = document.createElement("p");
                  acres.textContent = "Acres: " +
                    (p.ACRES ?? "Unknown");
                  panel.append(heading, acres);
                  polygon.bindPopup(panel);
                }
              }).addTo(map);

              map.fitBounds(layer.getBounds());
            </script>
          </body>
          </html>"""

          Path("output/map.html").write_text(
              html.replace(
                  "GEOJSON_PLACEHOLDER", geojson
              ),
              encoding="utf-8"
          )

          print("Created output/map.html")
          PY

      - name: Upload sample map
        uses: actions/upload-artifact@v4
        with:
          name: marion-parcel-sample
          path: output/
          retention-days: 30
