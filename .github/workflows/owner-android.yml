name: Private ownership Android verification
on:
  push:
    branches: [feat/private-offline-owners]
    paths: ['.github/workflows/owner-android.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Stable identity, rights gate and GIS regression tests
        run: python -m pytest -q --junitxml=output/owner-gis-tests.xml
      - name: Retrieve pinned unchanged county geometry and fallback assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p work/v032 work/v04 work/county-delivery
          gh release download verified-v0.3.2 --dir work/v032
          gh release download marion-county-v0.4.0 --pattern oregon-land-explorer-v0.4.0.apk --dir work/v04
          echo '3696d6a1b35abfb6ea8c1a21dca818ffd22390f64f8405f0c472f0d3b9a5b5d0  work/v04/oregon-land-explorer-v0.4.0.apk' | sha256sum -c
          gh run download 43696977024 --name marion-county-offline-maps --dir work/county-delivery
          cd work/county-delivery && sha256sum -c SHA256SUMS.txt
      - name: Stage unchanged core maps and synthetic county ownership only in test APK
        run: |
          python scripts/stage-county-android.py
          python -m pipeline.tile_fixtures
          PYTHONPATH=. python scripts/stage-owner-tests.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Restore persistent signing identity
        env: {OLE_SIGNING_KEY: '${{ secrets.OLE_SIGNING_KEY }}'}
        run: |
          test -n "$OLE_SIGNING_KEY"
          echo "$OLE_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/ole-signing.p12"
      - name: Compile signed APK, instrumentation, lint and unit checks
        env: {OLE_KEYSTORE: '${{ runner.temp }}/ole-signing.p12', OLE_STORE_PASSWORD: '${{ secrets.OLE_STORE_PASSWORD }}'}
        run: gradle -p android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest
      - name: Verify no Internet permission and unchanged original embedded maps
        run: python scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare faithful Mesa rendering and KVM
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/ole-xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade v0.4 without data loss; all-county owner lookup in airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu host -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-owner-device.sh
      - name: Prepare verified phone APK
        run: |
          mkdir -p output/owner-app
          cp android/app/build/outputs/apk/debug/app-debug.apk output/owner-app/oregon-land-explorer-v0.5.0.apk
          cp output/apk-validation.json output/owner-app/
          cd output/owner-app && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: oregon-land-explorer-owner-apk, path: output/owner-app/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-workflow-evidence
          path: |
            output/*.json
            output/*.xml
            output/*.txt
            output/emulator-screenshots/
            android/app/build/reports/
          retention-days: 30
