name: Offline Android APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'pipeline/**', 'regions/**', 'tests/**', 'scripts/check-apk.py', '.github/workflows/android-offline.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: GIS unit tests
        run: python -m pytest -q --junitxml=output/gis-tests.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Retrieve pinned PR 4 inputs and preserve baseline source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/expanded work/baseline-source
          gh release download expanded-v0.2 --pattern '*.olepack' --pattern oregon-land-explorer-expanded.apk --dir work/expanded
          python scripts/verify-expanded-inputs.py
          git archive e61cbef399f376f8d7f68fb48f8eb17c455d5a7f | tar -x -C work/baseline-source
          mkdir -p work/baseline-source/android/app/src/androidTest/assets/test-packs
          cp work/expanded/*.olepack work/baseline-source/android/app/src/androidTest/assets/test-packs/
          cp android/app/src/androidTest/java/org/oregonlandexplorer/ParcelPerformanceTest.kt work/baseline-source/android/app/src/androidTest/java/org/oregonlandexplorer/
      - name: Retain passed paired measurements only for unchanged app and GIS code
        id: paired
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet bcdaa8d0c8b818dede9f618cf3dfaaf52a19fd24 HEAD -- android/app/src/main android/app/build.gradle.kts android/build.gradle.kts android/settings.gradle.kts android/gradle.properties android/app/src/androidTest/java/org/oregonlandexplorer/ParcelPerformanceTest.kt android/app/src/androidTest/java/org/oregonlandexplorer/ParcelDatabaseTest.kt android/app/src/androidTest/java/org/oregonlandexplorer/LocalTilesTest.kt pipeline scripts/benchmark-parcels.sh; then
            gh run download 43630083953 --name offline-test-evidence --dir work/paired-evidence
            python scripts/reuse-parcel-benchmark.py work/paired-evidence
            python scripts/summarize-parcel-performance.py
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/restore@v4
        id: parcel-cache
        with:
          key: optimized-parcels-v2-${{ hashFiles('pipeline/**/*.py', 'pipeline/requirements.txt', 'scripts/verify-expanded-inputs.py') }}
          path: |
            output/*/
            output/*.olepack
            output/storage.json
            android/app/src/main/assets/packs/
            android/app/src/main/assets/glyphs/
            android/app/src/androidTest/assets/
      - name: Convert identical source extracts to schema 3
        if: steps.parcel-cache.outputs.cache-hit != 'true'
        run: python -m pipeline.optimize_release --source work/expanded
      - name: Audit exact rows, fingerprints, tile identities, geometry and checksums
        run: python -m pipeline.validate_packages
      - uses: actions/cache/save@v4
        if: steps.parcel-cache.outputs.cache-hit != 'true'
        with:
          key: optimized-parcels-v2-${{ hashFiles('pipeline/**/*.py', 'pipeline/requirements.txt', 'scripts/verify-expanded-inputs.py') }}
          path: |
            output/*/
            output/*.olepack
            output/storage.json
            android/app/src/main/assets/packs/
            android/app/src/main/assets/glyphs/
            android/app/src/androidTest/assets/
      - name: Generate independent local tile transport fixtures
        run: python -m pipeline.tile_fixtures
      - name: Compile app and instrumentation after geometry validation
        working-directory: android
        run: gradle --no-daemon :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
      - name: Restore stable expanded-app signing key
        env:
          OLE_SIGNING_KEY: ${{ secrets.OLE_SIGNING_KEY }}
        run: |
          test -n "$OLE_SIGNING_KEY"
          echo "$OLE_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/ole-signing.p12"
      - name: Compile identical benchmark against unchanged PR 4
        working-directory: work/baseline-source/android
        env:
          OLE_KEYSTORE: ${{ runner.temp }}/ole-signing.p12
          OLE_STORE_PASSWORD: ${{ secrets.OLE_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - name: Build signed APK, instrumentation APK, and lint
        working-directory: android
        env:
          OLE_KEYSTORE: ${{ runner.temp }}/ole-signing.p12
          OLE_STORE_PASSWORD: ${{ secrets.OLE_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest
      - name: Verify actual APK contents and permissions
        run: python scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare download folder
        run: |
          mkdir -p output/delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk output/delivery/
          cp output/*.olepack output/storage.json output/packages-validation.json output/apk-validation.json output/delivery/
          cd output/delivery && sha256sum *.apk *.olepack > SHA256SUMS.txt
      - name: Upload APK and map packages
        uses: actions/upload-artifact@v4
        with:
          name: oregon-land-explorer-optimized-preview
          path: output/delivery/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare Mesa software rendering for faithful labels and dashed trails
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/ole-xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          sleep 2
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline vector, import, parcel selection, GPS and restart
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OLE_KEYSTORE: ${{ runner.temp }}/ole-signing.p12
          OLE_STORE_PASSWORD: ${{ secrets.OLE_STORE_PASSWORD }}
          OLE_REUSE_BENCHMARK: ${{ steps.paired.outputs.reused }}
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu host -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-parcel-device.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-evidence
          path: |
            output/gis-tests.xml
            output/vector-validation.json
            output/packages-validation.json
            output/storage.json
            output/memory.txt
            output/emulator-crashes.txt
            output/*performance*.json
            output/*instrumentation.txt
            output/*cold*.txt
            output/*/parcel-validation.json
            output/*-memory-*.txt
            output/*-gfx.txt
            output/emulator-screenshots/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 30
