name: Offline Android APK
on:
  workflow_dispatch:
    inputs:
      region:
        description: Configured region name
        default: gervais
        type: choice
        options: [gervais]
  pull_request:
    paths: ['android/**', 'pipeline/**', 'regions/**', 'tests/**', 'scripts/check-apk.py', '.github/workflows/android-offline.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: GIS unit tests
        run: python -m pytest -q --junitxml=output/gis-tests.xml
      - name: Prepare real Gervais offline package
        run: python -m pipeline.build --region regions/gervais.json
      - name: Independently validate package
        run: python -m pipeline.validate output/region
      - name: Stage audited package in APK assets
        run: |
          mkdir -p android/app/src/main/assets/region
          cp output/region/* android/app/src/main/assets/region/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK, instrumentation APK, and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest
      - name: Verify actual APK contents and permissions
        run: python scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare simple download folder
        run: |
          mkdir -p output/delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk output/delivery/
          cp output/gervais.olepack output/SHA256SUMS.txt output/apk-validation.json output/delivery/
      - name: Upload installable APK and region
        uses: actions/upload-artifact@v4
        with:
          name: oregon-land-explorer-debug
          path: output/delivery/
          retention-days: 14
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test cold launch, offline imagery, parcel tap and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put global airplane_mode_on 1
            cd android && gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p "$GITHUB_WORKSPACE/output/emulator-screenshots"
            adb pull /sdcard/Android/data/org.oregonlandexplorer/files/. "$GITHUB_WORKSPACE/output/emulator-screenshots/"
      - name: Upload test evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-evidence
          path: |
            output/gis-tests.xml
            output/emulator-screenshots/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
