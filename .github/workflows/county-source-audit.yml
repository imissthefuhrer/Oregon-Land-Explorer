name: County non-owner source inventory comparison
on:
  workflow_dispatch:
    inputs:
      unit_only:
        description: Run GIS unit checks without querying live inventories again
        type: boolean
        default: false
      resource_run:
        description: Optional GIS delivery run to audit vector glyph resources instead of inventories
        required: false
  push:
    branches: [feat/marion-county-offline]
    paths: ['pipeline/source_inventory.py', '.github/workflows/county-source-audit.yml']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m pytest -q --junitxml=output/source-inventory/gis-tests.xml
      - if: ${{ !inputs.unit_only && !inputs.resource_run }}
        run: python -m pipeline.source_inventory
      - if: inputs.resource_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTY_RESOURCE_RUN: ${{ inputs.resource_run }}
        run: |
          gh run download "$COUNTY_RESOURCE_RUN" -n marion-county-offline-maps -D work/county-delivery
          python -m pipeline.county_resources
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: county-source-inventory-comparison, path: output/source-inventory/, retention-days: 30}
