name: Build signed county ZIP importer
on:
  push:
    branches: [feat/complete-private-delivery]
    paths: ['.github/workflows/delivery-android.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m pytest -q --junitxml=output/delivery-gis-tests.xml
      - name: Reuse exact existing signed APK core maps and public regression fixtures
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p work/v032 work/v05
          gh release download verified-v0.3.2 --dir work/v032
          gh release download private-owners-v0.5.0 --pattern '*.apk' --dir work/v05
          echo '4da14cf3fd1dcc9fc7ceff96467eef2bbc96090010b27723b6a249cd3c230867  work/v05/oregon-land-explorer-v0.5.0.apk' | sha256sum -c
          python scripts/stage-delivery-android.py
          python -m pipeline.tile_fixtures
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Restore existing signing identity
        env: {OLE_SIGNING_KEY: '${{ secrets.OLE_SIGNING_KEY }}'}
        run: |
          test -n "$OLE_SIGNING_KEY"
          echo "$OLE_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/ole-signing.p12"
      - name: Compile app, signed private-runtime instrumentation and lint
        env: {OLE_KEYSTORE: '${{ runner.temp }}/ole-signing.p12', OLE_STORE_PASSWORD: '${{ secrets.OLE_STORE_PASSWORD }}'}
        run: gradle -p android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify core integrity and no Internet permission
        run: python scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare Mesa/KVM
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/ole-xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Existing owner/GPS/aerial/picker and database regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu host -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-delivery-public.sh
      - name: Publish code-only signed app and test runner for PRIVATE real-data acceptance
        run: |
          mkdir -p output/delivery-build
          cp android/app/build/outputs/apk/debug/app-debug.apk output/delivery-build/Oregon-Land-Explorer-v0.6.0.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/delivery-build/private-runtime-tests.apk
          cp output/apk-validation.json output/delivery-build/
          cd output/delivery-build && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: signed-county-delivery-runtime, path: output/delivery-build/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-delivery-regressions
          path: |
            output/*.json
            output/*.txt
            output/*.xml
            output/public-evidence/
            android/app/build/reports/
