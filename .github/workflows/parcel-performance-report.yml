name: Parcel performance report
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing completed baseline and optimized benchmark evidence
        required: true
        default: '43630083953'
  pull_request:
    paths: ['scripts/summarize-parcel-performance.py', '.github/workflows/parcel-performance-report.yml']
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download executed measurements
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_RUN: ${{ inputs.run_id || '43630083953' }}
        run: |
          gh run download "$BENCHMARK_RUN" --name offline-test-evidence --dir work/report-input
          mkdir -p output/emulator-screenshots
          python - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('work/report-input')
          for name in ['baseline-performance.json','optimized-performance.json']:
              matches=list(source.rglob(name));assert len(matches)==1,(name,matches)
              shutil.copyfile(matches[0],Path('output/emulator-screenshots')/name)
          for path in source.rglob('*-cold-*.txt'):
              shutil.copyfile(path,Path('output')/path.name)
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BENCHMARK_RUN" > output/measurement-run.json
      - name: Inspect cold-start regression evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43633126888 --name offline-test-evidence --dir work/cold-start-evidence
          python - <<'PYCODE'
          from pathlib import Path
          for p in Path('work/cold-start-evidence/android').rglob('*'):
              if not p.is_file():continue
              print('EVIDENCE_FILE',p)
              if p.suffix=='.xml':print(p.read_text(errors='replace'))
              if 'logcat' in p.name.lower():
                  lines=p.read_text(errors='replace').splitlines()
                  selected=set()
                  for i,line in enumerate(lines):
                      if any(t in line for t in ['FATAL EXCEPTION','Fatal signal','AssertionError','junit.framework','Process: org.oregon','Abort message:','backtrace:']):selected.update(range(max(0,i-10),min(len(lines),i+50)))
                  print('\n'.join(lines[i] for i in sorted(selected)))
          PYCODE
      - run: python3 scripts/summarize-parcel-performance.py
      - uses: actions/upload-artifact@v4
        with:
          name: parcel-performance-report
          path: |
            output/parcel-performance.json
            output/measurement-run.json
